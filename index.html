<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NotiAI</title>
<meta name="description" content="흩어진 공지에서 내가 챙겨야 할 일정만 자동으로 정리해 주는 AI 일정 서비스">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --canvas: #F4F6FB; --paper: #FFFFFF; --ink: #171C26; --ink-2: #545D6E;
    --accent: #3B5BDB; --accent-soft: #EDF1FF; --rule: #E9ECF2;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--canvas); color: var(--ink);
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.6; word-break: keep-all;
  }
  main {
    width: 100%; max-width: 420px; padding: 40px 28px; text-align: center;
    background: var(--paper); border: 1px solid var(--rule); border-radius: 20px;
  }
  .logo { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
  .logo span { color: var(--accent); }
  .badge {
    display: inline-block; margin-top: 28px; padding: 6px 14px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 700;
  }
  .note { margin-top: 12px; font-size: 15px; }
  footer { margin-top: 28px; color: var(--ink-2); font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="logo">Noti<span>AI</span></div>
  <p class="badge">서비스 준비 중</p>
  <p class="note">2026년 11월 24일 졸업작품 전시에서 만나요.</p>
  <footer>충북대학교 소프트웨어학부 졸업작품</footer>
</main>
</body>
</html>
